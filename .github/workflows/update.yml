name: Update AdGuard filter

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate filter
        run: python scripts/update_filter.py
      - name: Commit changes
        run: |
          git add filters/bitwire-outbound.txt
          if git diff --cached --quiet; then
            echo "Filter is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bitwire outbound AdGuard filter"
          git push
